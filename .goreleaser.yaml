version: 2

project_name: sb

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - binary: sb
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/carlosgrillet/sandbox/internal/version.version={{.Version}}
      - -X github.com/carlosgrillet/sandbox/internal/version.gitCommit={{.FullCommit}}
      - -X github.com/carlosgrillet/sandbox/internal/version.gitTreeState=clean

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: carlosgrillet
    name: sandbox
  draft: false
  prerelease: auto
